[project]
name = "privacygaurd"
version = "0.1.0"
description = "Fine-tuning Qwen3 for PII detection and privacy-preserving text redaction"
readme = "README.md"
authors = [
    { name = "rohitkr8527", email = "rohitkr7518@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.0.1,<6",
    "matplotlib>=3.11.2",
    "modal>=1.5.5,<2",
    "pandas>=3.0.6,<4",
    "python-dotenv>=1.2.3",
    "streamlit>=1.64.0",
    "tqdm>=4.70.1,<5",
]

[project.scripts]
privacygaurd = "privacygaurd:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
